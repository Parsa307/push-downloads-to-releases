name: Download from yande.re

on:
  workflow_dispatch:
    inputs:
      ID:
        description: 'ID'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download from Booru
        run: curl -s "https://yande.re/post.json?tags=id:${{ github.event.inputs.ID }}" | jq -r '.[].jpeg_url' | aria2c -i-

      - name: Get Downloaded Filename
        id: filename
        run: echo "filename=$(ls -t | head -1)" >> $GITHUB_OUTPUT

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ steps.filename.outputs.filename }}
