name: Download from Danbooru (with limit)

on:
  workflow_dispatch:
    inputs:
      LIMIT:
        description: 'LIMIT'
        required: true
      TAG:
        description: 'TAG'

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download from Booru
        run: curl -s "https://danbooru.donmai.us/posts.json?limit=${{ github.event.inputs.LIMIT }}&tags=${{ github.event.inputs.TAG }}" | jq -r '.[].file_url' | aria2c -i-

      - name: Get Downloaded Filename
        id: filename
        run: echo "filename=$(ls -t | head -1)" >> $GITHUB_OUTPUT

      - name: Create Release on GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: ${{ steps.filename.outputs.filename }}
